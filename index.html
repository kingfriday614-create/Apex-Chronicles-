<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Apex Chronicle – Digital News &amp; Editorial Publication</title>
    <meta name="description" content="A modern, high-performance news and editorial publishing platform featuring breaking reports, comprehensive articles, and an enterprise publication suite." />
    <meta property="og:title" content="Apex Chronicle – Digital News &amp; Editorial Publication" />
    <meta property="og:description" content="A modern, high-performance news and editorial publishing platform featuring breaking reports, comprehensive articles, and an enterprise publication suite." />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@300;400;500;600;700&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;1,6..72,400&display=swap" rel="stylesheet">
    <script>
      // Single Page Apps for GitHub Pages
      // Decode redirect URL from 404.html if arriving via redirect
      (function(l) {
        if (l.search[1] === '/' ) {
          var decoded = l.search.slice(1).split('&').map(function(s) { 
            return s.replace(/~and~/g, '&')
          }).join('?');
          window.history.replaceState(null, null,
              l.pathname.slice(0, -1) + decoded + l.hash
          );
        }
      }(window.location));
    </script>
  </head>
  <body class="bg-stone-50 text-stone-900 antialiased selection:bg-stone-900 selection:text-white">
    <div id="root">
      <!-- Pre-mount fallback content to eliminate blank white screen during mobile asset transfer -->
      <div style="min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background-color: #fafaf9; color: #1c1917; padding: 24px; text-align: center;">
        <div style="border-bottom: 2px solid #1c1917; padding-bottom: 8px; margin-bottom: 16px;">
          <h1 style="font-family: Georgia, 'Times New Roman', serif; font-size: 28px; font-weight: bold; margin: 0; letter-spacing: -0.5px;">APEX CHRONICLE</h1>
        </div>
        <p style="font-size: 13px; color: #78716c; margin: 0; font-family: monospace;">Loading publication dispatches...</p>
      </div>
    </div>
    <noscript>
      <div style="padding: 24px; text-align: center; font-family: sans-serif; background-color: #fff; color: #1c1917;">
        <h2>JavaScript Required</h2>
        <p>Apex Chronicle requires JavaScript to display interactive editorial articles and dispatches. Please enable JavaScript in your browser settings.</p>
      </div>
    </noscript>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
